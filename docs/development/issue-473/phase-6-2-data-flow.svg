<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1180" viewBox="0 0 1450 1180" role="img" aria-labelledby="title desc">
<title id="title">Phase 6.2 annotated data flow</title>
<desc id="desc">The browser hop, discovery and Pi WTP remain open. New controller-to-Pi management and reverse retirement callbacks use purpose-separated TLS. Attached Pico management uses physical USB. Target grants, automatic source outcomes and acknowledgement recovery are implemented; phase software qualification passed for the retained sources.</desc>
<defs>
<marker id="local" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#46566b"/></marker>
<marker id="tls" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#14745a"/></marker>
<marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#aa4b18"/></marker>
<marker id="pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6c4ab6"/></marker>
<marker id="usb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#466681"/></marker>
</defs>
