name: Temporary Phase 6 archive observation
on:
  push:
    branches: [codex/ci-review-simplification]
    paths: [.github/workflows/ci-archive-diagnostic.yml]
permissions:
  contents: read
jobs:
  archive-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the same initial admission stages
        run: |
          python3 scripts/generate_control_contract.py --check
          make -C src ci-change-scope-test SUDO= CXX=true GPIOD_CPP_HEADER_AVAILABLE=0
          python3 scripts/tests/control_contract_pair_test.py
          python3 -B scripts/ci/change_scope.py
      - name: Install the same workflow validation dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-yaml build-essential pkg-config libssl-dev
      - name: Check the same execution graph
        run: python3 -B scripts/tests/ci_execution_graph_test.py
      - name: Run the unwrapped admission command
        run: python3 -B scripts/tests/network_build_test.py
      - name: Bounded archive reproduction sampling
        run: |
          for observation in $(seq 1 10); do
            echo "Archive observation $observation of at most 10; failures stop and remain failures"
            python3 -B scripts/tests/network_build_test.py NetworkBuild.test_custom_library_search_and_response_files_cannot_hide_changes
          done
