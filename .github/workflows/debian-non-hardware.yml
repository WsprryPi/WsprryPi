name: Non-hardware validation

on:
  workflow_dispatch:
    inputs:
      macos_runtime_only:
        description: Run native macOS runtime jobs only (other jobs are skipped)
        type: boolean
        default: false
      macos_controller_only:
        description: Qualify controller host contracts without local-transmitter semantics (runtime-only)
        type: boolean
        default: false
      macos_runtime_profiles:
        description: Native macOS profiles for a runtime-only dispatch
        type: choice
        default: all
        options: [all, arm64, macos-26, xcode-27]
      pico_ref:
        description: Pico source ref (defaults to the commit in the vendored contract provenance)
        type: string
  pull_request:
    branches: [devel, main]
  push:
    tags: ['v*']
    branches: [devel, main, codex/issue-419-native-macos, codex/shared-frequency-contract, codex/rp1-1.0-candidate-acceptance, codex/p15-8-wspr-type23, codex/step14-pico-type23-integration]

permissions:
  contents: read

concurrency:
  # A documentation-only successor must not cancel an in-flight code check.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}-${{ inputs.macos_runtime_only }}-${{ inputs.macos_runtime_profiles }}-${{ inputs.macos_controller_only }}
  cancel-in-progress: true

jobs:
  change_scope:
    name: Choose validation scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_full_ci: ${{ steps.classify.outputs.run_full_ci }}
      pico_sha: ${{ steps.pico-output.outputs.pico_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check shared control lifecycle and generated metadata
        run: python3 scripts/generate_control_contract.py --check
      - name: Check change-classification regressions
        run: make -C src ci-change-scope-test SUDO= CXX=true GPIOD_CPP_HEADER_AVAILABLE=0
      - name: Check selected-source contract parity regressions
        run: python3 scripts/tests/control_contract_pair_test.py
      - name: Inspect the complete Git comparison
        id: classify
        run: python3 -B scripts/ci/change_scope.py
      - name: Verify execution owners and source-selection refusals
        run: python3 -B scripts/tests/ci_execution_graph_test.py
      - name: Select requested or paired Pico ref
        if: steps.classify.outputs.run_full_ci != 'false'
        id: requested-pico
        env:
          PICO_REF: ${{ inputs.pico_ref }}
        run: |
          if [[ -n "$PICO_REF" ]]; then
            python3 -B scripts/ci/selected_source.py selection "$PICO_REF"
            printf 'pico_ref=%s\n' "$PICO_REF" >> "$GITHUB_OUTPUT"
          else
            python3 -B scripts/ci/selected_source.py paired src/wtp_integration/contract/PROVENANCE.json
          fi
      - name: Resolve Pico source once
        if: steps.classify.outputs.run_full_ci != 'false'
        uses: actions/checkout@v7
        with:
          repository: WsprryPi/WsprryPico
          ref: ${{ steps.requested-pico.outputs.pico_ref }}
          path: src/build/selected-pico
          persist-credentials: false
      - name: Record immutable Pico source
        if: steps.classify.outputs.run_full_ci != 'false'
        id: pico-output
        run: python3 -B scripts/ci/selected_source.py record src/build/selected-pico

  ci-build-regressions:
    needs: change_scope
    if: ${{ !cancelled() && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify incremental compilation and build failure recovery
        run: python3 -B scripts/tests/network_build_test.py
      - name: Check container build export handling
        run: |
          python3 -B scripts/tests/container_build_test.py
          python3 -B scripts/tests/container_avahi_contract_test.py
      - name: Verify Linux logger shutdown
        if: inputs.macos_runtime_only != true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsystemd-dev pkg-config
          python3 -B scripts/tests/logger_shutdown_test.py

  native-controller-components:
    name: Native controller components (${{ matrix.runner }})
    needs: change_scope
    if: ${{ !cancelled() && inputs.macos_runtime_only != true && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26, xcode-27, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and exercise native signal lifecycle
        run: |
          cmake -S src/Signal-Handler -B "${{ runner.temp }}/wsprrypi-signal" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "${{ runner.temp }}/wsprrypi-signal" --config Debug --parallel 2
          ctest --test-dir "${{ runner.temp }}/wsprrypi-signal" -C Debug --output-on-failure
      - name: Build and exercise native installation ownership
        run: |
          cmake -S src/Singleton -B "${{ runner.temp }}/wsprrypi-singleton" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "${{ runner.temp }}/wsprrypi-singleton" --config Debug --parallel 2
          ctest --test-dir "${{ runner.temp }}/wsprrypi-singleton" -C Debug --output-on-failure
      - name: Build and exercise native log timestamps
        run: |
          cmake -S src/LCBLog -B "${{ runner.temp }}/wsprrypi-lcblog" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "${{ runner.temp }}/wsprrypi-lcblog" --config Debug --parallel 2
          ctest --test-dir "${{ runner.temp }}/wsprrypi-lcblog" -C Debug --output-on-failure
      - name: Check native Windows protected files
        if: runner.os == 'Windows'
        run: |
          cmake -S src/tests/native_windows -B "${{ runner.temp }}/wsprrypi-native-windows"
          cmake --build "${{ runner.temp }}/wsprrypi-native-windows" --config Debug --parallel 2
          ctest --test-dir "${{ runner.temp }}/wsprrypi-native-windows" -C Debug --output-on-failure

  macos-simulated-profile:
    name: ${{ inputs.macos_runtime_only && inputs.macos_controller_only && 'Controller host contracts' || 'macos-simulated-profile' }} (${{ matrix.runner }})
    env: &macos-simulated-env
      MAKEFLAGS: -j2
      SI5351_TRANSPORT: mcp2221a-hid
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.runner == 'xcode-27' && '27.0' || '26.0' }}
      WSPRRYPI_DISABLE_HARDWARE_ACCESS: "1"
    needs: change_scope
    if: ${{ !cancelled() && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    strategy: &macos-runtime-strategy
      fail-fast: false
      matrix:
        runner: &macos-runtime-runners ${{ fromJSON('{"all":["macos-26","xcode-27"],"arm64":["macos-26","xcode-27"],"macos-26":["macos-26"],"xcode-27":["xcode-27"]}')[(inputs.macos_runtime_only && inputs.macos_runtime_profiles) || 'all'] }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - &checkout-macos-runtime
        name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - &setup-macos-python
        name: Select the pinned native Python runtime
        uses: actions/setup-python@v7
        with:
          python-version: '3.15.2'
      - &setup-macos-runtime-tools
        name: Select OpenSSL 4 development and fixture tools
        run: |
          brew install openssl@4 sqlite
          macos_openssl_prefix=$(brew --prefix openssl@4)
          macos_sqlite_prefix=$(brew --prefix sqlite)
          echo "${macos_openssl_prefix}/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=${macos_openssl_prefix}/lib/pkgconfig:${macos_sqlite_prefix}/lib/pkgconfig" >> "$GITHUB_ENV"
          "${macos_openssl_prefix}/bin/openssl" version

      - &verify-macos-runtime
        name: Record the native minimum-OS software profile
        run: |
          case "${{ matrix.runner }}" in
            macos-26) expected_macos_major=26 ;;
            xcode-27) expected_macos_major=27 ;;
            *) exit 1 ;;
          esac
          test "$(sw_vers -productVersion | cut -d. -f1)" = "$expected_macos_major"
          test "$(uname -m)" = arm64
          test "$MACOSX_DEPLOYMENT_TARGET" = "$expected_macos_major.0"
          sw_vers
          uname -m
          clang++ --version
          xcrun --sdk macosx --show-sdk-version
          python3 --version
          python3 -c "import sys; assert sys.version_info[:2] == (3, 15)"
          node --version
          pkg-config --modversion openssl sqlite3

      - name: Check bounded USB logging parser and policy
        working-directory: src
        run: make usb-logging-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=

      - name: Run portable semantics profile
        if: ${{ !(inputs.macos_runtime_only && inputs.macos_controller_only) }}
        working-directory: src
        run: |
          make semantics-make-regression-test SUDO=
          make semantics-test-portable SUDO=

      - name: Run controller state and native adapter contracts
        if: ${{ inputs.macos_runtime_only && inputs.macos_controller_only }}
        working-directory: src
        run: |
          make native-clock-test native-socket-test native-controller-owners-test controller-identity-store-test usb-cdc-native-test usb-cdc-descriptors-test usb-cdc-windows-metadata-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
          make companion-files-test sqlite-state-store-test persistent-configuration-test controller-settings-test state-migration-test sqlite-catalog-test sqlite-state-entry-test application-companion-capture-test recovery-capture-backend-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
          make local-control-transport-test local-event-feed-test browser-http-resource-test web-bootstrap-test database-controller-runtime-test controller-retirement-storage-binding-test diagnostic-export-test recovery-context-busy-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=

      - name: Run controller and target management contracts
        working-directory: src
        run: |
          make controller-only-test application-monitor-boundary-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
          make pico-management-target-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
          make pico-management-journal-test pico-management-history-test pico-target-controller-test controller-contract-test pico-usb-settings-test pi-config-persistence-coordinator-test pi-management-anchor-test pi-management-journal-test pi-managed-records-test pi-managed-store-test pi-management-service-test pi-managed-startup-test pi-managed-host-test pi-managed-host-runtime-test pi-private-network-persistence-test pi-managed-wtp-main-test wtp-managed-output-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=

      - name: Run TLS adapter and certificate regressions
        working-directory: src
        run: |
          pkg-config --modversion openssl
          make wtp-tls-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=

      - name: Run native execution, management, and retirement tests
        working-directory: src
        run: |
          make wtp-protocol-test wtp-usb-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
          make wtp-production-cpp-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
          make wtp-pi-authority-test wtp-pi-revocation-test \
            wtp-pi-tone-engine-test wtp-pi-identity-test wtp-pi-interface-selection-test \
            wtp-pi-si5351-realization-test wtp-pi-control-test wtp-pi-config-transaction-test \
            wtp-fleet-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=

      - name: Run the WTP browser unit test when Linux UI checks are excluded
        if: ${{ inputs.macos_runtime_only == true }}
        run: node WsprryPi-UI/tests/wtp_ui_test.js

  macos-controller-recovery:
    needs: change_scope
    if: ${{ !cancelled() && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    strategy: *macos-runtime-strategy
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env: *macos-simulated-env
    steps:
      - *checkout-macos-runtime
      - *setup-macos-python
      - *setup-macos-runtime-tools
      - *verify-macos-runtime

      - name: Build and audit the isolated controller profile
        run: |
          python3 scripts/tests/controller_build_profile_test.py
          python3 scripts/tests/controller_profile_entry_test.py
          env -u SI5351_TRANSPORT make -C src -j2 debug controller-transmitter-boundary-test application-monitor-boundary-test native-controller-identity-runtime-test BUILD_PROFILE=controller SUDO=
          python3 scripts/tests/controller_binary_audit.py src/build/bin/profiles/controller/wsprrypi_debug

      - name: Build the recovery fixtures in parallel
        working-directory: src
        run: make build/bin/recovery_maintenance_fixture build/bin/recovery_native_owner_fixture build/bin/recovery_evidence_test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=

      - name: Run bounded recovery role, relocation, and restart matrix
        if: ${{ !(inputs.macos_runtime_only && inputs.macos_controller_only) }}
        working-directory: src
        run: make recovery-integration-after-portable-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=

      - name: Run the complete recovery matrix for controller-only dispatches
        if: ${{ inputs.macos_runtime_only && inputs.macos_controller_only }}
        working-directory: src
        run: make recovery-integration-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=

      - name: Qualify pairing and controller roles without hardware
        if: ${{ inputs.macos_runtime_only != true }}
        run: |
          make -C src pairing-provider-test pi-pair-contract-test pi-pair-crypto-test pi-pair-tls-test pi-pair-machine-service-test pi-pair-runtime-test pi-pair-local-http-test pi-pair-service-lifetime-test pi-pair-outgoing-rotation-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
          python3 scripts/tests/pairing_support_redaction_test.py
          python3 scripts/tests/copy_exe_notice_test.py

  macos-pico-carriers:
    needs: change_scope
    if: ${{ !cancelled() && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    name: macos-pico-carriers (${{ matrix.runner }}, ${{ matrix.carrier }})
    strategy:
      fail-fast: false
      matrix:
        runner: *macos-runtime-runners
        carrier: [network, usb]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env: *macos-simulated-env
    steps:
      - *checkout-macos-runtime
      - *setup-macos-python
      - *setup-macos-runtime-tools
      - *verify-macos-runtime

      - &verify-macos-pi-source
        name: Verify immutable Pi source for native Mac carriers
        run: |
          source_revision=$(git rev-parse --verify 'HEAD^{commit}')
          source_status=$(git status --porcelain --untracked-files=all)
          test "$source_revision" = "$GITHUB_SHA"
          test -z "$source_status"
          git rev-parse HEAD 'HEAD^{tree}'
      - name: Require immutable Pico selection for native Mac carriers
        env:
          PICO_SHA: ${{ needs.change_scope.outputs.pico_sha }}
        run: python3 -B scripts/ci/selected_source.py require "$PICO_SHA"
      - uses: actions/checkout@v7
        with:
          repository: WsprryPi/WsprryPico
          ref: ${{ needs.change_scope.outputs.pico_sha }}
          path: src/build/controller-native-reference/pico
          persist-credentials: false
      - &verify-macos-pico-source
        name: Verify immutable Pico source for native Mac carriers
        env:
          PICO_SHA: ${{ needs.change_scope.outputs.pico_sha }}
        run: python3 -B scripts/ci/selected_source.py verify "$PICO_SHA" src/build/controller-native-reference/pico
      - name: Verify the selected shared contract
        run: python3 scripts/generate_control_contract.py --source src/build/controller-native-reference/pico --check
      - uses: actions/checkout@v7
        if: matrix.carrier == 'network'
        with:
          repository: Mbed-TLS/mbedtls
          ref: 0bebf8b8c7f07abe3571ded48a11aa907a1ffb20
          path: src/build/controller-native-reference/mbedtls
          submodules: recursive
          persist-credentials: false
      - name: Exercise actual native Mac controller and Pico network peers
        if: matrix.carrier == 'network'
        working-directory: src
        run: |
          make -j2 wtp-network-tools-build BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
          make pi-network-runtime-regression-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
          make pico-https-management-interop-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO= PICO_SOURCE=build/controller-native-reference/pico MBEDTLS_SOURCE=build/controller-native-reference/mbedtls
          make pico-control-interop-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO= PICO_SOURCE=build/controller-native-reference/pico MBEDTLS_SOURCE=build/controller-native-reference/mbedtls
      - name: Build the actual software Pico USB endpoint on native Mac
        if: matrix.carrier == 'usb'
        run: |
          cmake -S src/build/controller-native-reference/pico -B src/build/controller-native-reference/pico-usb -DWSPRRY_PICO_BUILD_FIRMWARE=OFF -DWSPRRY_PICO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build src/build/controller-native-reference/pico-usb --target usb_management_driver -j2
          make -C src pico-usb-control-client-build pico-usb-management-contract-test wtp-fleet-operations-driver-build build/bin/pico_management_usb_pair_client BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
      - name: Exercise native Mac clients through production Pico USB handlers
        if: matrix.carrier == 'usb'
        run: |
          WSPRRYPI_GPIO_DRIVE_REQUIRED=1 node WsprryPi-UI/tests/pico_usb_control_pair_test.js src/build/wtp-network/pico_usb_control_client src/build/controller-native-reference/pico-usb/usb_management_driver
          node WsprryPi-UI/tests/pico_management_usb_pair_test.js src/build/bin/pico_management_usb_pair_client src/build/controller-native-reference/pico-usb/usb_management_driver
          node WsprryPi-UI/tests/fleet_operations_pair_test.js src/build/bin/wtp_fleet_operations_driver usb "$PWD/src/build/controller-native-reference/pico-usb/usb_management_driver"
      - *verify-macos-pico-source
      - *verify-macos-pi-source

  macos-si5351-profile:
    needs: change_scope
    if: ${{ !cancelled() && inputs.macos_runtime_only != true && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env: *macos-simulated-env
    steps:
      - *checkout-macos-runtime
      - *setup-macos-python
      - *setup-macos-runtime-tools
      - *verify-macos-runtime
      - name: Build the explicit native physical profile without opening hardware
        run: make -j2 -C src release backend-profile-factory-test BACKENDS=si5351 ANCILLARY_GPIO=0 SUDO=
      - name: Exercise transport selection and scripted HID failures
        run: |
          python3 scripts/tests/si5351_transport_make_test.py
          make -C src/WSPR-Transmitter/src mcp2221a-transport-test si5351-planner-test si5351-transition-test si5351-startup-portable-test SUDO=
      - name: Audit the native binary and compiled transport
        run: |
          python3 scripts/tests/macos_si5351_audit.py src/build/bin/wsprrypi
          python3 scripts/tests/early_cli_exit_test.py src/build/bin/wsprrypi mcp2221a-hid
          cmp docs/licenses/botan/BSD-2-Clause.txt src/build/bin/BOTAN-LICENSE.txt
          cmp scripts/pairing_provider.json src/build/bin/PAIRING-PROVIDER.json
      - name: Check native cached inventory and unsupported machine-power admission
        run: make -C src si5351-inventory-isolation-test websocket-lifecycle-test controller-only-test BACKENDS=si5351 ANCILLARY_GPIO=0 SUDO=

  pico-network-management-pair:
    needs: change_scope
    if: ${{ !cancelled() && inputs.macos_runtime_only != true && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    runs-on: ubuntu-24.04
    # Cold dependency installation and C++ builds share this budget with TLS,
    # routing, and browser checks; allow the final checks to finish on cold runners.
    timeout-minutes: 45
    name: pico-network-management-pair (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [interop, browser]
    env:
      WSPRRYPI_DISABLE_HARDWARE_ACCESS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install host-only TLS and UI test dependencies
        run: |
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://azure.archive.ubuntu.com/ubuntu|g' -e 's|http://archive.ubuntu.com/ubuntu|https://azure.archive.ubuntu.com/ubuntu|g' -e 's|http://security.ubuntu.com/ubuntu|https://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y libssl-dev libsqlite3-dev libavahi-client-dev libsystemd-dev pkg-config cmake python3 php-cli iproute2 tcpdump
      - name: Select the Pico browser test runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.8.0'
          package-manager-cache: false
      - name: Install UI development dependencies
        working-directory: WsprryPi-UI
        run: npm ci --ignore-scripts
      - name: Require immutable Pico selection
        env:
          PICO_SHA: ${{ needs.change_scope.outputs.pico_sha }}
        run: python3 -B scripts/ci/selected_source.py require "$PICO_SHA"
      - name: Selected Pico source
        uses: actions/checkout@v7
        with:
          repository: WsprryPi/WsprryPico
          ref: ${{ needs.change_scope.outputs.pico_sha }}
          path: src/build/network-reference/pico
          persist-credentials: false
      - name: Verify immutable Pico source
        env:
          PICO_SHA: ${{ needs.change_scope.outputs.pico_sha }}
        run: python3 -B scripts/ci/selected_source.py verify "$PICO_SHA" src/build/network-reference/pico
      - name: Verify shared contract and lifecycle against the selected Pico
        run: python3 scripts/generate_control_contract.py --source src/build/network-reference/pico --check
      - name: Record frozen pair source manifests
        run: |
          set -euo pipefail
          git diff --exit-code HEAD
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/pi-pair-revision.before"
          git -C src/build/network-reference/pico rev-parse HEAD HEAD^{tree}
          git ls-files -z | xargs -0 sha256sum -- > "$RUNNER_TEMP/pi-pair-source.before"
          (cd src/build/network-reference/pico && git ls-files -z | xargs -0 sha256sum) > "$RUNNER_TEMP/pico-pair-source.before"
      - name: Read-only pinned Pico TLS dependency
        uses: actions/checkout@v7
        with:
          repository: Mbed-TLS/mbedtls
          ref: 0bebf8b8c7f07abe3571ded48a11aa907a1ffb20
          path: src/build/network-reference/mbedtls
          submodules: recursive
          persist-credentials: false
      - name: Select bounded build budget
        run: make -C src ci-build-budget BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
      - name: Validate retained Fleet records without execution
        if: matrix.suite == 'interop'
        run: |
          make -C src debug wtp-fleet-test wtp-fleet-operations-driver-build BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
      - name: Parent TLS, shared API and actual Pico interoperability
        if: matrix.suite == 'interop'
        working-directory: src
        run: |
          make udp-logging-worker udp-logging-test SUDO=
          python3 -B ../scripts/tests/udp_log_control_test.py
          make production-browser-regression-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO= TEST_NETNS_RUNNER="sudo unshare --net"
          make tls-observer-test SUDO=
          make wtp-catalog-test SUDO=
          make -j2 wtp-network-tools-build BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
          make pi-network-runtime-regression-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
          make pico-https-management-interop-test SUDO= PICO_SOURCE=build/network-reference/pico MBEDTLS_SOURCE=build/network-reference/mbedtls
          make pico-control-interop-test SUDO= PICO_SOURCE=build/network-reference/pico MBEDTLS_SOURCE=build/network-reference/mbedtls
          node ../WsprryPi-UI/tests/fleet_operations_pair_test.js build/bin/wtp_fleet_operations_driver network "$PWD/build/wtp-network/pico_tls_server" "$PWD/build/wtp-network/credentials-v3"
      - name: Shipped Pico controls through actual public and encrypted HTTP handlers
        if: matrix.suite == 'browser'
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          cmake -S src/build/network-reference/pico -B src/build/network-reference/pico-browser -DWSPRRY_PICO_BUILD_FIRMWARE=OFF -DWSPRRY_PICO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DWSPRRY_PICO_TEST_MBEDTLS_PATH="$PWD/src/build/network-reference/mbedtls"
          cmake --build src/build/network-reference/pico-browser --target consumer_session_driver consumer_bootstrap_driver -j2
          npm --prefix src/build/network-reference/pico/src/network/bootstrap_web ci --ignore-scripts
          node --test src/build/network-reference/pico/tests/chrome_startup.test.mjs src/build/network-reference/pico/tests/ui_process_cleanup.test.mjs
          node src/build/network-reference/pico/tests/consumer_sessions.test.mjs src/build/network-reference/pico-browser/consumer_session_driver
          node src/build/network-reference/pico/tests/operator_cleanup_browser.mjs src/build/network-reference/pico-browser/consumer_session_driver
          PROGRESS_BROWSER_NO_CAPTURE=1 node src/build/network-reference/pico/tests/progress_browser_integration.mjs src/build/network-reference/pico-browser/consumer_bootstrap_driver
          node src/build/network-reference/pico/tests/consumer_recovery_browser.mjs src/build/network-reference/pico-browser/consumer_bootstrap_driver
          node src/build/network-reference/pico/tests/organization_routes.test.mjs src/build/network-reference/pico-browser/consumer_bootstrap_driver src/build/network-reference/pico-browser/generated/web_assets.cpp
          node src/build/network-reference/pico/tests/organization_browser_integration.mjs src/build/network-reference/pico-browser/consumer_bootstrap_driver
      - name: Current shared Setup through the actual Pi and Pico handlers
        if: matrix.suite == 'interop'
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          make -C src -j2 build/bin/shared_setup_main_fixture BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
          WSPRRYPI_SHARED_SETUP_MAIN_FIXTURE="$PWD/src/build/bin/shared_setup_main_fixture" node WsprryPi-UI/tests/pico_controller_http_pair_test.js "$PWD/src/build/wtp-network" "$PWD/src/build/bin/pico_controller_pair_fixture" --browser --shared-browser
      - name: Prove edited Pico source selection and genuine build failures
        if: matrix.suite == 'browser'
        run: python3 -B scripts/tests/pico_source_selection_test.py src/build/network-reference/pico src/build/network-reference/mbedtls
      - name: Render logging, USB, and Fleet controls with mocked responses
        if: matrix.suite == 'browser'
        working-directory: WsprryPi-UI
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node tests/udp_logging_ui_integration_test.js ../src/build/network-reference/pico
          (cd data && php -r '$_GET["page"]="logs";include "index.php";') > /tmp/udp-logs-rendered.html
          LOGGING_RENDERED_HTML=/tmp/udp-logs-rendered.html node tests/udp_logging_logs_browser_test.js
          LOGGING_REAL_STREAM=1 LOGGING_RENDERED_HTML=/tmp/udp-logs-rendered.html node tests/usb_logging_browser_test.js
          node tests/wtp_usb_ui_integration_test.js
          node tests/wtp_pi_fleet_ui_integration_test.js

      - name: Render network and recovery controls with production readbacks
        if: matrix.suite == 'interop'
        working-directory: WsprryPi-UI
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node tests/wtp_network_ui_integration_test.js
          WSPRRYPI_RUN_RECOVERY_BROWSER=1 node tests/wtp_recovery_ui_integration_test.js
      - name: Verify immutable Pico source after the complete recipe
        env:
          PICO_SHA: ${{ needs.change_scope.outputs.pico_sha }}
        run: python3 -B scripts/ci/selected_source.py verify "$PICO_SHA" src/build/network-reference/pico
      - name: Verify frozen pair sources after the complete recipe
        run: |
          set -euo pipefail
          git diff --exit-code HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/pi-pair-revision.after"
          git ls-files -z | xargs -0 sha256sum -- > "$RUNNER_TEMP/pi-pair-source.after"
          (cd src/build/network-reference/pico && git ls-files -z | xargs -0 sha256sum) > "$RUNNER_TEMP/pico-pair-source.after"
          for record in pi-pair-revision pi-pair-source pico-pair-source; do
            test -s "$RUNNER_TEMP/$record.before"
            cmp "$RUNNER_TEMP/$record.before" "$RUNNER_TEMP/$record.after"
          done
          sha256sum "$RUNNER_TEMP/"{pi,pico}-pair-source.{before,after}
          echo "PASS: frozen Pi/Pico source manifests matched before and after the complete network recipe"
      - name: Retain failed network browser captures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: network-browser-failure-${{ matrix.suite }}-${{ github.run_attempt }}
          path: |
            src/build/wtp-network/ui
            src/build/wtp-network/ui-usb-progress
          if-no-files-found: ignore
          retention-days: 7

  pico-usb-management-pair:
    needs: change_scope
    if: ${{ !cancelled() && inputs.macos_runtime_only != true && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Verify image-provided USB host tools
        # The named hosted image provides CMake/Node outside dpkg. Installing
        # duplicate distribution packages adds downloads without selecting them.
        # Actual CMake/OpenSSL compilation and production tests remain below.
        run: |
          set -euo pipefail
          for tool in cmake python3 node c++ make pkg-config; do
            command -v "$tool"
          done
          cmake --version
          python3 --version
          node --version
          c++ --version
          make --version
          pkg-config --modversion openssl
          pkg-config --cflags --libs openssl
          pkg-config --modversion sqlite3
          pkg-config --cflags --libs sqlite3
      - name: Require immutable Pico selection
        env:
          PICO_SHA: ${{ needs.change_scope.outputs.pico_sha }}
        run: python3 -B scripts/ci/selected_source.py require "$PICO_SHA"
      - uses: actions/checkout@v7
        with:
          repository: WsprryPi/WsprryPico
          ref: ${{ needs.change_scope.outputs.pico_sha }}
          path: src/build/usb-reference/pico
          persist-credentials: false
      - name: Verify immutable Pico source
        env:
          PICO_SHA: ${{ needs.change_scope.outputs.pico_sha }}
        run: python3 -B scripts/ci/selected_source.py verify "$PICO_SHA" src/build/usb-reference/pico
      - name: Verify shared contract and lifecycle against the selected Pico
        run: python3 scripts/generate_control_contract.py --source src/build/usb-reference/pico --check
      - name: Record frozen pair source manifests
        run: |
          set -euo pipefail
          git diff --exit-code HEAD
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/pi-pair-revision.before"
          git -C src/build/usb-reference/pico rev-parse HEAD HEAD^{tree}
          git ls-files -z | xargs -0 sha256sum -- > "$RUNNER_TEMP/pi-pair-source.before"
          (cd src/build/usb-reference/pico && git ls-files -z | xargs -0 sha256sum) > "$RUNNER_TEMP/pico-pair-source.before"
      - name: Select bounded build budget
        run: make -C src ci-build-budget BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
      - name: Build actual production Pico USB endpoint without SDK or network
        run: |
          cmake -S src/build/usb-reference/pico -B src/build/usb-reference/pico-host -DWSPRRY_PICO_BUILD_FIRMWARE=OFF -DWSPRRY_PICO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build src/build/usb-reference/pico-host --target usb_management_driver -j2
      - name: Build Pi USB clients and negative contract checks
        run: make -C src pico-usb-control-client-build pico-usb-management-contract-test wtp-fleet-operations-driver-build build/bin/pico_management_usb_pair_client BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
      - name: Actual UI producer through production Pi and Pico USB handlers
        run: |
          node WsprryPi-UI/tests/wtp_usb_settings_test.js
          WSPRRYPI_GPIO_DRIVE_REQUIRED=1 node WsprryPi-UI/tests/pico_usb_control_pair_test.js src/build/wtp-network/pico_usb_control_client src/build/usb-reference/pico-host/usb_management_driver
          WSPRRYPI_DISABLE_HARDWARE_ACCESS=1 node WsprryPi-UI/tests/pico_management_usb_pair_test.js src/build/bin/pico_management_usb_pair_client src/build/usb-reference/pico-host/usb_management_driver
          WSPRRYPI_DISABLE_HARDWARE_ACCESS=1 node WsprryPi-UI/tests/fleet_operations_pair_test.js src/build/bin/wtp_fleet_operations_driver usb "$PWD/src/build/usb-reference/pico-host/usb_management_driver"

      - name: Verify immutable Pico source after the complete recipe
        env:
          PICO_SHA: ${{ needs.change_scope.outputs.pico_sha }}
        run: python3 -B scripts/ci/selected_source.py verify "$PICO_SHA" src/build/usb-reference/pico
      - name: Verify frozen pair sources after the complete recipe
        run: |
          set -euo pipefail
          git diff --exit-code HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/pi-pair-revision.after"
          git ls-files -z | xargs -0 sha256sum -- > "$RUNNER_TEMP/pi-pair-source.after"
          (cd src/build/usb-reference/pico && git ls-files -z | xargs -0 sha256sum) > "$RUNNER_TEMP/pico-pair-source.after"
          for record in pi-pair-revision pi-pair-source pico-pair-source; do
            test -s "$RUNNER_TEMP/$record.before"
            cmp "$RUNNER_TEMP/$record.before" "$RUNNER_TEMP/$record.after"
          done
          sha256sum "$RUNNER_TEMP/"{pi,pico}-pair-source.{before,after}
          echo "PASS: frozen Pi/Pico source manifests matched before and after the complete usb recipe"

  strict-i2c-profile:
    needs: change_scope
    if: ${{ !cancelled() && inputs.macos_runtime_only != true && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    runs-on: ubuntu-24.04
    # Cold package downloads can exceed ten minutes before compilation starts.
    # Retain time for the complete strict build and its unchanged audits.
    timeout-minutes: 30
    container:
      image: ubuntu:24.04
      volumes:
        - /etc/ssl/certs/ca-certificates.crt:/runner-ca-certificates.crt:ro
    env:
      WSPRRYPI_DISABLE_HARDWARE_ACCESS: "1"
    steps:
      - name: Install build dependencies without libgpiod
        run: |
          sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://azure.archive.ubuntu.com/ubuntu|g' -e 's|http://archive.ubuntu.com/ubuntu|https://azure.archive.ubuntu.com/ubuntu|g' -e 's|http://security.ubuntu.com/ubuntu|https://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          apt-get -o Acquire::https::CaInfo=/runner-ca-certificates.crt update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::https::CaInfo=/runner-ca-certificates.crt install -y --no-install-recommends \
            build-essential ca-certificates git libssl-dev libsqlite3-dev libavahi-client-dev libsystemd-dev pkg-config \
            python3 strace

      - name: Check out source
        uses: actions/checkout@v7

      - name: Trust checkout ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Select bounded build budget
        run: make -C src ci-build-budget BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
      - name: Build and audit strict Si5351 profile
        working-directory: src
        run: |
          make release backend-profile-factory-test \
            BACKENDS=si5351 ANCILLARY_GPIO=0 SUDO=
          su -s /bin/sh nobody -c \
            '../scripts/tests/strict_i2c_profile_test.sh ./build/bin/wsprrypi'
          su -s /bin/sh nobody -c \
            '../scripts/tests/strict_i2c_file_access_audit.sh ./build/bin/wsprrypi'
          ../scripts/tests/strict_i2c_install_path_test.sh

      - name: Build and audit the zero-backend controller without libgpiod
        run: |
          python3 scripts/tests/controller_build_profile_test.py
          python3 scripts/tests/controller_profile_entry_test.py
          make -C src -j2 debug controller-transmitter-boundary-test application-monitor-boundary-test BUILD_PROFILE=controller SUDO=
          python3 scripts/tests/controller_binary_audit.py src/build/bin/profiles/controller/wsprrypi_debug

  ubuntu-gcc13-release:
    needs: change_scope
    if: ${{ !cancelled() && inputs.macos_runtime_only != true && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    runs-on: ubuntu-24.04
    name: ubuntu-gcc13-release (${{ matrix.profile }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: rpi-gpio
            omitted: si5351
          - profile: rp1-gpclk
            omitted: si5351
          - profile: si5351
            omitted: simulated
          - profile: simulated
            omitted: si5351
          - profile: si5351,simulated
            omitted: gpio
          - profile: rpi-gpio,rp1-gpclk,si5351,simulated
            omitted: ''
    steps:
      - name: Install release-build dependencies
        run: |
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://azure.archive.ubuntu.com/ubuntu|g' -e 's|http://archive.ubuntu.com/ubuntu|https://azure.archive.ubuntu.com/ubuntu|g' -e 's|http://security.ubuntu.com/ubuntu|https://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git libgpiod-dev libssl-dev libsqlite3-dev libavahi-client-dev libsystemd-dev pkg-config python3

      - name: Check out source
        uses: actions/checkout@v7

      - name: Select bounded build budget
        run: make -C src ci-build-budget BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
      - name: Verify GCC 13 toolchain
        run: test "$(g++ -dumpversion | cut -d. -f1)" = 13

      - name: Build parent release executable with warnings as errors
        working-directory: src
        env:
          BACKEND_PROFILE: ${{ matrix.profile }}
          OMITTED_BACKEND: ${{ matrix.omitted }}
        run: |
          make release backend-profile-factory-test BACKENDS="$BACKEND_PROFILE" SUDO=
          ../scripts/tests/backend_capability_reporting_test.sh \
            ./build/bin/wsprrypi "$BACKEND_PROFILE" "$OMITTED_BACKEND"
          python3 ../scripts/tests/early_cli_exit_test.py ./build/bin/wsprrypi

  non-hardware-validation:
    needs: change_scope
    if: ${{ !cancelled() && inputs.macos_runtime_only != true && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    runs-on: ubuntu-24.04
    # Keep the traced tests and final audit on the same runner.
    timeout-minutes: 40
    container: debian:trixie-slim
    env: &linux-validation-env
      WSPRRYPI_DISABLE_HARDWARE_ACCESS: "1"
    defaults: &linux-validation-defaults
      run:
        shell: /usr/sbin/runuser -u wsprrypi-ci -- /bin/bash --noprofile --norc -e -o pipefail {0}
    steps:
      - &install-linux-validation-dependencies
        name: Install build and audit dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            age build-essential ca-certificates cmake device-tree-compiler git libgpiod-dev libssl-dev libsqlite3-dev libavahi-client-dev \
            libsystemd-dev nodejs npm passwd php-cli pkg-config python3 shellcheck strace util-linux
          # This disposable container does not boot systemd. Production-path
          # identity tests need the machine ID that an installed system provides.
          if [[ ! -s /etc/machine-id ]]; then
            tr -d '-' </proc/sys/kernel/random/uuid >/etc/machine-id
          fi

      - &checkout-linux-source
        name: Check out source
        uses: actions/checkout@v7

      - &select-linux-checkout-owner
        name: Select unprivileged checkout owner
        shell: bash
        run: |
          # Recovery workers must execute below directories owned by their
          # own user or root, including GitHub's runner-owned workspace parent.
          useradd --uid "$(stat -c %u "$(dirname "$GITHUB_WORKSPACE")")" \
            --create-home --shell /bin/bash wsprrypi-ci
          chown -R wsprrypi-ci:wsprrypi-ci "$GITHUB_WORKSPACE"

      - &trust-linux-checkout-owner
        name: Trust parent checkout ownership
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - &select-linux-build-budget
        name: Select bounded build budget
        run: make -C src ci-build-budget BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
      - name: Check bounded USB logging parser and policy
        working-directory: src
        run: make usb-logging-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=

      - name: Build parent debug executable
        working-directory: src
        run: |
          make backend-capabilities-regression-test SUDO=
          make backend-capabilities-make-regression-test SUDO=
          make build-metadata-regression-test build-metadata-make-regression-test SUDO=
          make debug SUDO=

      - name: Run parent semantics and cleanup lifecycle tests
        id: traced-semantics
        working-directory: src
        run: |
          make semantics-make-regression-test SUDO=
          strace --seccomp-bpf -f -y -e trace=open,openat,openat2,creat \
            -o /tmp/wsprrypi-semantics.strace \
            make semantics-test SUDO=
          strace --seccomp-bpf -f -y -e trace=open,openat,openat2,creat \
            -o /tmp/wsprrypi-startup-quiesce-parent.strace \
            make startup-quiesce-parent-test SUDO=

      - name: Run RP1 non-hardware regression
        working-directory: src
        run: |
          uname -sr
          strace -V
          trap 'ci_rp1_status=$?; if [ "$ci_rp1_status" -ne 0 ]; then tail -n 120 /tmp/wsprrypi-rp1.strace >&2 || :; fi; exit "$ci_rp1_status"' EXIT
          strace --seccomp-bpf -f -y -e trace=open,openat,openat2,creat,clone,clone3,fork,vfork,wait4,waitid,exit,exit_group,kill,tgkill,setpgid \
            -o /tmp/wsprrypi-rp1.strace \
            make object-dependency-test \
              rp1-gpclk-planner-test rp1-gpclk-lifecycle-test rp1-gpclk-transition-test \
              rp1-gpclk-backend-test rp1-gpclk-linux-provider-test \
              rp1-gpclk-development-policy-test rp1-gpclk-route-runtime-wiring-test \
              rp1-gpclk-route-service-test rp1-gpclk-transmit-backend-test \
              rp1-gpclk-diagnostics-test rp1-release-acceptance-test rp1-drive-cli-test SUDO=

      - name: Execute focused state, network policy and support lifecycle obligations
        working-directory: src
        run: |
          strace --seccomp-bpf -f -y -e trace=open,openat,openat2,creat -o /tmp/wsprrypi-focused.strace \
            make ci-focused-state-test ci-network-policy-test ci-support-lifecycle-test SUDO=
      - name: Run transmitter component contract regressions
        working-directory: src/WSPR-Transmitter/src
        run: |
          make -j2 simulated-backend-test
          make -j2 build/bin/simulated_transmit_backend_realtime_test
          timeout 5s ./build/bin/simulated_transmit_backend_realtime_test
          make -j2 transmission-controller-contract-test
          make -j2 startup-quiesce-test
          make -j2 si5351-transition-test

      - name: Build and test WSPR reference component
        working-directory: src/WSPR-Reference
        run: |
          cmake -S . -B /tmp/wspr-reference-build
          cmake --build /tmp/wspr-reference-build --parallel 2
          WSPR_REFERENCE_BUILD_DIR=/tmp/wspr-reference-build \
            ./tests/run_major_regressions.sh

      - name: Verify WSPR reference package consumer
        working-directory: src/WSPR-Reference
        run: |
          cmake --install /tmp/wspr-reference-build \
            --prefix /tmp/wspr-reference-install
          cmake -S examples/consumer -B /tmp/wspr-reference-consumer \
            -DCMAKE_PREFIX_PATH=/tmp/wspr-reference-install
          cmake --build /tmp/wspr-reference-consumer --parallel 2
          /tmp/wspr-reference-consumer/consumer

      - name: Verify deterministic hardware-free simulation
        working-directory: src
        run: ../scripts/ci/verify-simulated-backend.sh

      - name: Verify complete application-planned WSPR simulation
        working-directory: src
        run: ../scripts/ci/verify-simulated-wspr.sh

      - name: Verify hardware-access audit fails closed
        run: python3 scripts/tests/no_transmitter_hardware_audit_test.py

      - name: Reject transmitter hardware access
        if: ${{ !cancelled() && (steps.traced-semantics.outcome == 'success' || steps.traced-semantics.outcome == 'failure') }}
        run: |
          scripts/ci/assert-no-transmitter-hardware.sh \
            /tmp/wsprrypi-semantics.strace \
            /tmp/wsprrypi-startup-quiesce-parent.strace \
            /tmp/wsprrypi-rp1.strace \
            /tmp/wsprrypi-focused.strace \
            /tmp/wsprrypi-simulator.strace \
            /tmp/wsprrypi-wspr-simulator.strace

  debian-installer-support:
    needs: change_scope
    if: ${{ !cancelled() && inputs.macos_runtime_only != true && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: debian:trixie-slim
    env: *linux-validation-env
    defaults: *linux-validation-defaults
    steps:
      - *install-linux-validation-dependencies
      - *checkout-linux-source
      - *select-linux-checkout-owner
      - *trust-linux-checkout-owner
      - *select-linux-build-budget

      - name: Prepare writable installer build directory
        run: mkdir -p src/build

      - name: Read-only RP1-GPIO-CLK-DKMS stable reference
        uses: actions/checkout@v7
        with:
          repository: WsprryPi/RP1-GPIO-CLK-DKMS
          ref: e17d710499e8c7c630d2eda6adececd7f6b797f5 # v1.0.0 provider source; package remains release-selected
          path: src/build/rp1-provider-reference
          persist-credentials: false

      - name: Set reference checkout ownership
        shell: bash
        run: chown -R wsprrypi-ci:wsprrypi-ci "$GITHUB_WORKSPACE/src/build/rp1-provider-reference"

      - name: Execute offline installer and maintenance obligations
        id: traced-installer
        env:
          RP1_DKMS_SOURCE: ${{ github.workspace }}/src/build/rp1-provider-reference
        working-directory: src
        run: |
          command -v shellcheck
          strace --seccomp-bpf -f -y -e trace=open,openat,openat2,creat -o /tmp/wsprrypi-installer.strace \
            make ci-installer-offline-test php2shell-test SUDO=

      - name: Reject installer transmitter hardware access
        if: ${{ !cancelled() && (steps.traced-installer.outcome == 'success' || steps.traced-installer.outcome == 'failure') }}
        run: scripts/ci/assert-no-transmitter-hardware.sh /tmp/wsprrypi-installer.strace

      - name: Validate actual provider update and bootstrap boundary
        run: python3 -B scripts/tests/rp1_gpclk_update_contract_test.py src/build/rp1-provider-reference

      - name: Qualify support-bundle age round trip
        id: traced-support
        env:
          RP1_DKMS_SOURCE: ${{ github.workspace }}/src/build/rp1-provider-reference
        working-directory: src
        run: |
          strace --seccomp-bpf -f -y -e trace=open,openat,openat2,creat \
            -o /tmp/wsprrypi-support.strace bash -e -o pipefail <<'SUPPORT'
          make support-bundle-job-manager-test support-bundle-http-test \
            support-bundle-private-artifact-test support-bundle-age-roundtrip-test \
            support-bundle-production-encryption-metadata-test support-bundle-key-provisioning-test SUDO=
          WSPRRYPI_REAL_OPENSSL=/usr/bin/openssl make support-bundle-signing-key-provisioning-test \
            support-bundle-intake-manifest-preparation-test support-bundle-intake-manifest-lifecycle-test SUDO=
          make support-bundle-intake-production-manifest-test support-bundle-intake-publication-commit-test \
            support-bundle-intake-publication-push-test support-bundle-intake-publication-verification-test \
            support-bundle-intake-trust-compilation-test support-bundle-intake-production-trust-test \
            support-bundle-intake-identity-ceremony-preflight-test support-bundle-maintainer-intake-inspection-test \
            support-bundle-maintainer-processing-test support-bundle-retention-audit-test \
            support-bundle-retention-deletion-test support-bundle-collector-contract-test SUDO=
          make support-bundle-age-dependency-test installer-dependency-test \
            rp1-gpclk-dkms-installer-test SUDO=
          make support-bundle-intake-validation-test support-bundle-intake-state-test \
            support-bundle-intake-retrieval-test support-bundle-intake-controller-test \
            support-bundle-intake-runtime-test support-bundle-intake-production-test SUDO=
          SUPPORT

      - name: Reject support-bundle transmitter hardware access
        if: ${{ !cancelled() && (steps.traced-support.outcome == 'success' || steps.traced-support.outcome == 'failure') }}
        run: scripts/ci/assert-no-transmitter-hardware.sh /tmp/wsprrypi-support.strace

  debian-browser-validation:
    needs: change_scope
    if: ${{ !cancelled() && inputs.macos_runtime_only != true && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    runs-on: ubuntu-24.04
    name: debian-browser-validation (${{ matrix.suite }})
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [ui, production]
    container: debian:trixie-slim
    env: *linux-validation-env
    defaults: *linux-validation-defaults
    steps:
      - *install-linux-validation-dependencies
      - name: Install Chromium
        shell: bash
        run: DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends chromium
      - *checkout-linux-source
      - *select-linux-checkout-owner
      - *trust-linux-checkout-owner
      - *select-linux-build-budget

      - name: Install UI development dependencies
        working-directory: WsprryPi-UI
        run: npm ci --ignore-scripts

      - name: Run UI component and browser regressions
        if: matrix.suite == 'ui'
        working-directory: WsprryPi-UI
        run: |
          npm test
          npm run test:browser

      - name: Build the recovery browser fixture in parallel
        if: matrix.suite == 'production'
        working-directory: src
        run: make build/bin/recovery_maintenance_fixture SUDO=

      - name: Run production browser integration regressions
        if: matrix.suite == 'production'
        working-directory: WsprryPi-UI
        run: |
          make -C ../src -j1 recovery-maintenance-browser-test recovery-maintenance-controller-browser-test SUDO=
          make -C ../src controller-only-test pico-management-target-test SUDO=
          make -C ../src -j2 build/bin/profiles/controller/controller_only_production_fixture BUILD_PROFILE=controller SUDO=
          WSPRRYPI_CONTROLLER_FIXTURE="$PWD/../src/build/bin/profiles/controller/controller_only_production_fixture" node tests/controller_mode_browser_test.js

  linux-native-contracts:
    needs: change_scope
    if: ${{ !cancelled() && inputs.macos_runtime_only != true && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container: debian:trixie-slim
    env: *linux-validation-env
    defaults: *linux-validation-defaults
    steps:
      - *install-linux-validation-dependencies
      - *checkout-linux-source
      - *select-linux-checkout-owner
      - *trust-linux-checkout-owner
      - *select-linux-build-budget

      - name: Verify the BCM2835 qualification owner without hardware
        working-directory: src
        run: make gpio-qualification-owner gpio-qualification-owner-test SUDO=

      - name: Run native execution, management, and retirement tests
        working-directory: src
        run: |
          make wtp-protocol-test wtp-usb-test pico-usb-management-contract-test wtp-production-cpp-test SUDO=
          make wtp-pi-authority-test wtp-pi-revocation-test \
            wtp-pi-tone-engine-test wtp-pi-identity-test wtp-pi-interface-selection-test \
            wtp-pi-si5351-realization-test wtp-pi-control-test wtp-pi-config-transaction-test \
            wtp-fleet-test SUDO=
          make wtp-retirement-config-test pi-managed-records-test pi-management-journal-test pi-management-anchor-test \
            pi-config-persistence-coordinator-test pi-managed-store-test pi-management-service-test \
            pi-managed-startup-test pi-managed-host-test pi-managed-host-runtime-test \
            pi-private-network-persistence-test pi-managed-main-test wtp-managed-output-test SUDO=
          # The production pre-parse privilege gate intentionally rejects an
          # unprivileged WTP invocation of a GPIO-capable executable. Exercise
          # its actual-main software fixture with an explicit GPIO-free build.
          make pi-managed-wtp-main-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO= \
            OBJ_DIR_DEBUG=build/managed-wtp-main-objects BIN_DIR=build/managed-wtp-main-bin

      - name: Frequency and Test Tone contracts
        working-directory: src
        run: |
          make test-tone-request-test test-tone-frequency-plan-test test-tone-selector-plan-test test-tone-response-test SUDO=
          make band-lookup-correlation-test wspr-band-catalog-test wspr-preset-catalog-response-test SUDO=
          make -j2 wtp-network-unit-build SUDO=
          make wspr-tone-regression-test qrss-execution-regression-test wtp-config-cpp-test wtp-api-cpp-test SUDO=
