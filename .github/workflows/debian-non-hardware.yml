name: Non-hardware validation

on:
  workflow_dispatch:
    inputs:
      pico_ref:
        description: Pico source ref (defaults to devel)
        default: devel
        type: string
  pull_request:
    branches: [devel, main]
  push:
    tags: ['v*']
    branches: [devel, main, codex/shared-frequency-contract, codex/rp1-1.0-candidate-acceptance, codex/p15-8-wspr-type23, codex/step14-pico-type23-integration]

permissions:
  contents: read

concurrency:
  # A documentation-only successor must not cancel an in-flight code check.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  change_scope:
    name: Choose validation scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_full_ci: ${{ steps.classify.outputs.run_full_ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check shared control lifecycle and generated metadata
        run: python3 scripts/generate_control_contract.py --check
      - name: Check change-classification regressions
        run: make -C src ci-change-scope-test SUDO= CXX=true GPIOD_CPP_HEADER_AVAILABLE=0
      - name: Check selected-source contract parity regressions
        run: python3 scripts/tests/control_contract_pair_test.py
      - name: Inspect the complete Git comparison
        id: classify
        run: python3 -B scripts/ci/change_scope.py

  macos-simulated-profile:
    needs: change_scope
    if: ${{ !cancelled() && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Select OpenSSL 4 development and fixture tools
        run: |
          brew install openssl@4
          macos_openssl_prefix=$(brew --prefix openssl@4)
          echo "${macos_openssl_prefix}/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=${macos_openssl_prefix}/lib/pkgconfig" >> "$GITHUB_ENV"
          "${macos_openssl_prefix}/bin/openssl" version

      - name: Check bounded USB logging parser and policy
        working-directory: src
        run: make usb-logging-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=

      - name: Run portable semantics profile
        working-directory: src
        run: |
          make semantics-make-regression-test SUDO=
          make semantics-test-portable SUDO=

      - name: Run TLS adapter and certificate regressions
        working-directory: src
        run: |
          pkg-config --modversion openssl
          make wtp-tls-test SUDO=

      - name: Run WTP component, plan, USB adapter, backend, scheduler and status tests
        working-directory: src
        run: |
          make wtp-protocol-test wtp-plan-test wtp-usb-test wtp-usb-management-test wtp-backend-test wtp-scheduler-test wtp-status-test wtp-application-test SUDO=
          make wtp-production-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
          make wtp-pi-authority-test wtp-pi-listener-test wtp-pi-revocation-test \
            wtp-pi-tone-engine-test wtp-pi-identity-test wtp-pi-interface-selection-test \
            wtp-pi-si5351-realization-test wtp-pi-control-test wtp-pi-config-transaction-test \
            wtp-fleet-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=

      - name: Check container build export handling
        run: |
          python3 scripts/tests/container_build_test.py
          python3 scripts/tests/container_avahi_contract_test.py

  wtp-network-loopback:
    needs: change_scope
    if: ${{ !cancelled() && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    runs-on: ubuntu-24.04
    # Cold dependency installation and C++ builds share this budget with TLS,
    # routing, and browser checks; allow the final checks to finish on cold runners.
    timeout-minutes: 45
    env:
      WSPRRYPI_DISABLE_HARDWARE_ACCESS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install host-only TLS and UI test dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libavahi-client-dev libsystemd-dev pkg-config cmake python3 nodejs php-cli iproute2 tcpdump
      - name: Install UI development dependencies
        working-directory: WsprryPi-UI
        run: npm ci --ignore-scripts
      - name: Selected Pico source
        uses: actions/checkout@v7
        with:
          repository: WsprryPi/WsprryPico
          ref: ${{ inputs.pico_ref || 'devel' }}
          path: src/build/network-reference/pico
          persist-credentials: false
      - name: Record selected Pico source
        run: git -C src/build/network-reference/pico log -1 --format='%H %D'
      - name: Verify shared contract and lifecycle against the selected Pico
        run: python3 scripts/generate_control_contract.py --source src/build/network-reference/pico --check
      - name: Read-only pinned Pico TLS dependency
        uses: actions/checkout@v7
        with:
          repository: Mbed-TLS/mbedtls
          ref: 0bebf8b8c7f07abe3571ded48a11aa907a1ffb20
          path: src/build/network-reference/mbedtls
          submodules: recursive
      - name: Parent TLS, shared API and actual Pico interoperability
        working-directory: src
        run: |
          make udp-logging-worker udp-logging-test SUDO=
          python3 -B ../scripts/tests/udp_log_control_test.py
          make production-browser-regression-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO= TEST_NETNS_RUNNER="sudo unshare --net"
          make tls-observer-test SUDO=
          make wtp-catalog-test SUDO=
          make wtp-tls-test SUDO=
          make wtp-network-runtime-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=
          make wtp-network-interop-test SUDO= PICO_SOURCE=build/network-reference/pico MBEDTLS_SOURCE=build/network-reference/mbedtls
          make wtp-config-interop-test SUDO= PICO_SOURCE=build/network-reference/pico MBEDTLS_SOURCE=build/network-reference/mbedtls
      - name: Shipped Pico controls through actual public and encrypted HTTP handlers
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          cmake -S src/build/network-reference/pico -B src/build/network-reference/pico-browser -DWSPRRY_PICO_BUILD_FIRMWARE=OFF -DWSPRRY_PICO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DWSPRRY_PICO_TEST_MBEDTLS_PATH="$PWD/src/build/network-reference/mbedtls"
          cmake --build src/build/network-reference/pico-browser --target consumer_session_driver consumer_bootstrap_driver -j2
          npm --prefix src/build/network-reference/pico/src/network/bootstrap_web ci --ignore-scripts
          node src/build/network-reference/pico/tests/consumer_sessions.test.mjs src/build/network-reference/pico-browser/consumer_session_driver
          node src/build/network-reference/pico/tests/operator_cleanup_browser.mjs src/build/network-reference/pico-browser/consumer_session_driver
          PROGRESS_BROWSER_NO_CAPTURE=1 node src/build/network-reference/pico/tests/progress_browser_integration.mjs src/build/network-reference/pico-browser/consumer_bootstrap_driver
          node src/build/network-reference/pico/tests/consumer_recovery_browser.mjs src/build/network-reference/pico-browser/consumer_bootstrap_driver
      - name: Prove edited Pico source selection and genuine build failures
        run: python3 -B scripts/tests/pico_source_selection_test.py src/build/network-reference/pico src/build/network-reference/mbedtls
      - name: Verify selected-interface WTP replies under equal-metric route changes
        working-directory: src
        run: |
          make wtp-pi-routing-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=sudo
          python3 -B ../docs/development/wtp-reply-routing-results/rollback_test.py
      - name: Render network controls with mocked responses
        working-directory: WsprryPi-UI
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node tests/udp_logging_ui_integration_test.js ../src/build/network-reference/pico
          (cd data && php -r '$_GET["page"]="logs";include "index.php";') > /tmp/udp-logs-rendered.html
          LOGGING_RENDERED_HTML=/tmp/udp-logs-rendered.html node tests/udp_logging_logs_browser_test.js
          LOGGING_REAL_STREAM=1 LOGGING_RENDERED_HTML=/tmp/udp-logs-rendered.html node tests/usb_logging_browser_test.js
          node tests/wtp_usb_ui_integration_test.js
          node tests/wtp_network_ui_integration_test.js
          node tests/wtp_pi_fleet_ui_integration_test.js
          WSPRRYPI_RUN_RECOVERY_BROWSER=1 node tests/wtp_recovery_ui_integration_test.js

  wtp-usb-management-pair:
    needs: change_scope
    if: ${{ !cancelled() && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: USB host-only build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev pkg-config cmake python3 nodejs
      - uses: actions/checkout@v7
        with:
          repository: WsprryPi/WsprryPico
          ref: ${{ inputs.pico_ref || 'devel' }}
          path: src/build/usb-reference/pico
          persist-credentials: false
      - name: Record selected Pico source
        run: git -C src/build/usb-reference/pico log -1 --format='%H %D'
      - name: Verify shared contract and lifecycle against the selected Pico
        run: python3 scripts/generate_control_contract.py --source src/build/usb-reference/pico --check
      - name: Build actual production Pico USB endpoint without SDK or network
        run: |
          cmake -S src/build/usb-reference/pico -B src/build/usb-reference/pico-host -DWSPRRY_PICO_BUILD_FIRMWARE=OFF -DWSPRRY_PICO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build src/build/usb-reference/pico-host --target usb_management_driver -j2
      - name: Build Pi USB clients and negative contract checks
        run: make -C src wtp-usb-pair-client-build wtp-usb-management-test SUDO=
      - name: Actual UI producer through production Pi and Pico USB handlers
        run: |
          node WsprryPi-UI/tests/wtp_usb_settings_test.js
          WSPRRYPI_GPIO_DRIVE_REQUIRED=1 node WsprryPi-UI/tests/wtp_usb_pair_test.js src/build/wtp-network/wtp_usb_pair_client src/build/usb-reference/pico-host/usb_management_driver

  strict-i2c-profile:
    needs: change_scope
    if: ${{ !cancelled() && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: ubuntu:24.04
    env:
      WSPRRYPI_DISABLE_HARDWARE_ACCESS: "1"
    steps:
      - name: Install build dependencies without libgpiod
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates git libssl-dev libavahi-client-dev libsystemd-dev pkg-config \
            python3 strace

      - name: Check out source
        uses: actions/checkout@v7

      - name: Trust checkout ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and audit strict Si5351 profile
        working-directory: src
        run: |
          make release backend-profile-factory-test \
            BACKENDS=si5351 ANCILLARY_GPIO=0 SUDO=
          su -s /bin/sh nobody -c \
            '../scripts/tests/strict_i2c_profile_test.sh ./build/bin/wsprrypi'
          su -s /bin/sh nobody -c \
            '../scripts/tests/strict_i2c_file_access_audit.sh ./build/bin/wsprrypi'
          ../scripts/tests/strict_i2c_install_path_test.sh

  ubuntu-gcc13-release:
    needs: change_scope
    if: ${{ !cancelled() && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    runs-on: ubuntu-24.04
    # Six serial warning-as-error profiles exceeded 15 minutes on the runner.
    timeout-minutes: 30
    steps:
      - name: Install release-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git libgpiod-dev libssl-dev libavahi-client-dev libsystemd-dev pkg-config python3

      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify GCC 13 toolchain
        run: test "$(g++ -dumpversion | cut -d. -f1)" = 13

      - name: Build parent release executable with warnings as errors
        working-directory: src
        run: |
          for profile in \
            rpi-gpio \
            rp1-gpclk \
            si5351 \
            simulated \
            si5351,simulated \
            rpi-gpio,rp1-gpclk,si5351,simulated
          do
            make release backend-profile-factory-test BACKENDS="$profile" SUDO=
            omitted=
            case "$profile" in
              rpi-gpio) omitted=si5351 ;;
              rp1-gpclk) omitted=si5351 ;;
              si5351) omitted=simulated ;;
              simulated) omitted=si5351 ;;
              si5351,simulated) omitted=gpio ;;
            esac
            ../scripts/tests/backend_capability_reporting_test.sh \
              ./build/bin/wsprrypi "$profile" "$omitted"
            python3 ../scripts/tests/early_cli_exit_test.py ./build/bin/wsprrypi
          done
          python3 ../scripts/tests/logger_shutdown_test.py

  non-hardware-validation:
    needs: change_scope
    if: ${{ !cancelled() && (needs.change_scope.result != 'success' || needs.change_scope.outputs.run_full_ci != 'false') }}
    runs-on: ubuntu-24.04
    # Cold container builds and the full regression suite can exceed 15 minutes,
    # including cleanup after the final assertions have passed.
    timeout-minutes: 25
    container: debian:trixie-slim
    env:
      WSPRRYPI_DISABLE_HARDWARE_ACCESS: "1"
    steps:
      - name: Install build and audit dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            age build-essential ca-certificates chromium cmake device-tree-compiler git libgpiod-dev libssl-dev libavahi-client-dev \
            libsystemd-dev nodejs npm php-cli pkg-config python3 strace

      - name: Check out source
        uses: actions/checkout@v7

      - name: Trust parent checkout ownership
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check bounded USB logging parser and policy
        working-directory: src
        run: make usb-logging-test BACKENDS=simulated ANCILLARY_GPIO=0 SUDO=

      - name: Build parent debug executable
        working-directory: src
        run: |
          make backend-capabilities-regression-test SUDO=
          make backend-capabilities-make-regression-test SUDO=
          make build-metadata-regression-test build-metadata-make-regression-test SUDO=
          make debug SUDO=

      - name: Run WTP component, plan, USB adapter, backend, scheduler and status tests
        working-directory: src
        run: |
          make wtp-protocol-test wtp-plan-test wtp-usb-test wtp-usb-management-test wtp-backend-test wtp-scheduler-test wtp-status-test wtp-application-test wtp-production-test SUDO=
          make wtp-pi-authority-test wtp-pi-listener-test wtp-pi-revocation-test \
            wtp-pi-tone-engine-test wtp-pi-identity-test wtp-pi-interface-selection-test \
            wtp-pi-si5351-realization-test wtp-pi-control-test wtp-pi-config-transaction-test \
            wtp-fleet-test SUDO=

      - name: Frequency and Test Tone contracts
        working-directory: src
        run: |
          make test-tone-request-test test-tone-frequency-plan-test test-tone-selector-plan-test test-tone-response-test test-tone-lifecycle-test legacy-tone-frequency-test SUDO=
          make band-lookup-correlation-test wspr-band-catalog-test wspr-preset-catalog-response-test SUDO=
          make wspr-tone-regression-test qrss-execution-regression-test wtp-plan-test wtp-fleet-test wtp-config-test wtp-api-test SUDO=
      - name: Run parent semantics and cleanup lifecycle tests
        working-directory: src
        run: |
          make semantics-make-regression-test SUDO=
          strace -f -e trace=openat,open \
            -o /tmp/wsprrypi-semantics.strace \
            make semantics-test SUDO=
          strace -f -e trace=openat,open \
            -o /tmp/wsprrypi-startup-quiesce-parent.strace \
            make startup-quiesce-parent-test SUDO=

      - name: Install UI development dependencies
        working-directory: WsprryPi-UI
        run: npm ci --ignore-scripts

      - name: Run UI component regressions
        working-directory: WsprryPi-UI
        run: npm test

      - name: Run UI browser integration regressions
        working-directory: WsprryPi-UI
        run: npm run test:browser

      - name: Run RP1 non-hardware regression
        working-directory: src
        run: |
          strace -f -e trace=openat,open \
            -o /tmp/wsprrypi-rp1.strace \
            make object-dependency-test \
              rp1-gpclk-planner-test rp1-gpclk-lifecycle-test rp1-gpclk-transition-test \
              rp1-gpclk-backend-test rp1-gpclk-linux-provider-test \
              rp1-gpclk-development-policy-test rp1-gpclk-route-runtime-wiring-test \
              rp1-gpclk-route-service-test rp1-gpclk-transmit-backend-test \
              rp1-gpclk-diagnostics-test rp1-release-acceptance-test SUDO=

      - name: Read-only published RP1 1.0.0 provider reference
        uses: actions/checkout@v7
        with:
          repository: WsprryPi/RP1-GPCLK-DKMS
          ref: 8c16d3c237cb1267cbedafb5da2bb74132ca5de0
          path: src/build/rp1-provider-reference
          persist-credentials: false

      - name: Validate actual provider update and bootstrap boundary
        run: python3 -B scripts/tests/rp1_gpclk_update_contract_test.py src/build/rp1-provider-reference

      - name: Qualify support-bundle age round trip
        working-directory: src
        run: |
          make support-bundle-job-manager-test support-bundle-http-test SUDO=
          make support-bundle-private-artifact-test support-bundle-age-roundtrip-test SUDO=
          make support-bundle-production-encryption-metadata-test SUDO=
          make support-bundle-key-provisioning-test SUDO=
          WSPRRYPI_REAL_OPENSSL=/usr/bin/openssl make support-bundle-signing-key-provisioning-test SUDO=
          WSPRRYPI_REAL_OPENSSL=/usr/bin/openssl make support-bundle-intake-manifest-preparation-test SUDO=
          WSPRRYPI_REAL_OPENSSL=/usr/bin/openssl make support-bundle-intake-manifest-lifecycle-test SUDO=
          make support-bundle-intake-production-manifest-test SUDO=
          make support-bundle-intake-publication-commit-test SUDO=
          make support-bundle-intake-publication-push-test SUDO=
          make support-bundle-intake-publication-verification-test SUDO=
          make support-bundle-intake-trust-compilation-test SUDO=
          make support-bundle-intake-production-trust-test SUDO=
          make support-bundle-intake-identity-ceremony-preflight-test SUDO=
          make support-bundle-maintainer-intake-inspection-test SUDO=
          make support-bundle-maintainer-processing-test SUDO=
          make support-bundle-retention-audit-test SUDO=
          make support-bundle-retention-deletion-test SUDO=
          make support-bundle-contract-reconciliation-test SUDO=
          make support-bundle-age-dependency-test installer-dependency-test \
            rp1-gpclk-dkms-installer-test SUDO=
          make support-bundle-intake-validation-test SUDO=
          make support-bundle-intake-state-test SUDO=
          make support-bundle-intake-retrieval-test SUDO=
          make support-bundle-intake-controller-test SUDO=
          make support-bundle-intake-runtime-test SUDO=
          make support-bundle-intake-production-test SUDO=

      - name: Run transmitter component contract regressions
        working-directory: src/WSPR-Transmitter/src
        run: |
          make simulated-backend-test
          make build/bin/simulated_transmit_backend_realtime_test
          timeout 5s ./build/bin/simulated_transmit_backend_realtime_test
          make transmission-controller-contract-test
          make startup-quiesce-test
          make si5351-transition-test

      - name: Build and test WSPR reference component
        working-directory: src/WSPR-Reference
        run: |
          cmake -S . -B /tmp/wspr-reference-build
          cmake --build /tmp/wspr-reference-build --parallel 2
          WSPR_REFERENCE_BUILD_DIR=/tmp/wspr-reference-build \
            ./tests/run_major_regressions.sh

      - name: Verify WSPR reference package consumer
        working-directory: src/WSPR-Reference
        run: |
          cmake --install /tmp/wspr-reference-build \
            --prefix /tmp/wspr-reference-install
          cmake -S examples/consumer -B /tmp/wspr-reference-consumer \
            -DCMAKE_PREFIX_PATH=/tmp/wspr-reference-install
          cmake --build /tmp/wspr-reference-consumer --parallel 2
          /tmp/wspr-reference-consumer/consumer

      - name: Verify deterministic hardware-free simulation
        working-directory: src
        run: ../scripts/ci/verify-simulated-backend.sh

      - name: Verify complete application-planned WSPR simulation
        working-directory: src
        run: ../scripts/ci/verify-simulated-wspr.sh

      - name: Verify hardware-access audit fails closed
        run: python3 scripts/tests/no_transmitter_hardware_audit_test.py

      - name: Reject transmitter hardware access
        run: |
          scripts/ci/assert-no-transmitter-hardware.sh \
            /tmp/wsprrypi-semantics.strace \
            /tmp/wsprrypi-startup-quiesce-parent.strace \
            /tmp/wsprrypi-rp1.strace \
            /tmp/wsprrypi-simulator.strace \
            /tmp/wsprrypi-wspr-simulator.strace
